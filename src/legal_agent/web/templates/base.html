<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Acme Agreement Desk{% endblock %}</title>
<meta name="claude:viewport-fit-sides" content="cover">
{% block head %}{% endblock %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Acme Agreement Desk. Contract text is set in a serif, like the paper it comes from;
   the tool around it is a quiet sans. Colour is kept for meaning: redline, decisions, highlights. */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --sunken: #f0f2f5; --ink: #14171c; --ink-2: #485060; --ink-3: #737b8a;
  --rule: #e2e5ea; --rule-strong: #c9ced6; --accent: #1e3a6b; --accent-ink: #ffffff; --accent-wash: #e9eef7;
  --esc: #a3261c; --esc-wash: #fbeceb; --push: #8c5600; --push-wash: #fbf2e2; --ok: #24704c; --ok-wash: #e8f3ed;
  --del: #b42318; --ins: #1d4fbf; --hl: #ffe98a; --shadow: 0 1px 2px rgba(20, 23, 28, .05), 0 12px 40px rgba(20, 23, 28, .14);
  --serif: "Source Serif 4", Charter, "Iowan Old Style", Georgia, serif;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1215; --surface: #171b20; --sunken: #1d2228; --ink: #e7eaee; --ink-2: #a7afbb; --ink-3: #828b99;
  --rule: #272d35; --rule-strong: #3a424d; --accent: #9db8ea; --accent-ink: #0f1215; --accent-wash: #1b2638;
  --esc: #f1958c; --esc-wash: #3a1d1a; --push: #e8b766; --push-wash: #352a14; --ok: #7cc9a0; --ok-wash: #16302a;
  --del: #f1958c; --ins: #9db8ea; --hl: #5c4c12; --shadow: 0 12px 40px rgba(0, 0, 0, .5); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f1215; --surface: #171b20; --sunken: #1d2228; --ink: #e7eaee; --ink-2: #a7afbb; --ink-3: #828b99;
  --rule: #272d35; --rule-strong: #3a424d; --accent: #9db8ea; --accent-ink: #0f1215; --accent-wash: #1b2638;
  --esc: #f1958c; --esc-wash: #3a1d1a; --push: #e8b766; --push-wash: #352a14; --ok: #7cc9a0; --ok-wash: #16302a;
  --del: #f1958c; --ins: #9db8ea; --hl: #5c4c12; --shadow: 0 12px 40px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 0 80px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 18px; margin-bottom: 28px; border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 600; letter-spacing: -.01em; }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 14px/1 var(--sans); }
.brand span { color: var(--ink-3); font-weight: 400; }
.tagline { color: var(--ink-3); font-size: 13px; }
h1 { font: 600 clamp(26px, 3.6vw, 36px)/1.15 var(--serif); letter-spacing: -.015em; margin: 0; text-wrap: balance; }
h2 { font: 600 19px/1.3 var(--serif); margin: 0; }
.eyebrow { font-size: 13px; color: var(--ink-3); }
.eyebrow a { color: var(--ink-2); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.mono { font-family: var(--mono); font-size: .88em; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; }
.status { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.st-awaiting-decision::before, .st-reviewing::before { background: var(--accent); }
.st-signed::before { background: var(--ok); }
.st-sent-back::before { background: var(--push); }
.st-escalated::before, .st-failed::before { background: var(--esc); }
.dec { display: inline-flex; align-items: center; gap: 7px; font: 600 12px/1 var(--sans); letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; }
.dec::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.dec-escalate { color: var(--esc); } .dec-push_back { color: var(--push); } .dec-accept { color: var(--ok); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 14px/1 var(--sans); padding: 11px 16px; border-radius: 8px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; text-decoration: none; }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--rule-strong); }
.btn.secondary:hover { border-color: var(--ink-3); }
.btn.small { padding: 7px 11px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: progress; }
.link { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
.link:hover { text-decoration-style: solid; }
:is(a, button, input, textarea, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], textarea { width: 100%; font: 15px/1.4 var(--sans); padding: 10px 12px; border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--surface); color: var(--ink); }
input[type=file] { font: 14px var(--sans); color: var(--ink-2); max-width: 100%; }
textarea { min-height: 84px; resize: vertical; }
label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 6px; }
.notice { border-radius: 10px; padding: 12px 14px; background: var(--esc-wash); color: var(--ink); border: 1px solid var(--esc); }
.file { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.file svg { flex: none; color: var(--ink-3); }
.file-name { font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
.file-tag { white-space: nowrap; font: 12px/1 var(--mono); color: var(--ink-3); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 6px; }
.file-actions { display: flex; gap: 14px; margin-left: auto; font-size: 14px; }
{% block style %}{% endblock %}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">A</span>Acme <span>Agreement Desk</span></a>
    <span class="tagline">AI reviews every redline. A person signs.</span>
  </header>
  {% block content %}{% endblock %}
</div>
<script>
// A slow action (starting an upload) disables its buttons and says what is happening.
document.querySelectorAll("form[data-busy]").forEach(form => form.addEventListener("submit", event => {
  const button = event.submitter || form.querySelector("button");
  // Disable after the browser has read the form: a disabled button's name=value is not sent.
  setTimeout(() => form.querySelectorAll("button").forEach(b => b.disabled = true));
  if (button) button.textContent = form.dataset.busy;
}));
</script>
{% block script %}{% endblock %}
</body>
</html>
