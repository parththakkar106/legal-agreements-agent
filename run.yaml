# Our evaluator runs these commands EXACTLY as written, in this order,
# from a fresh checkout. Every command is non-interactive and idempotent.

setup_commands:
  - "pip install -r requirements.txt"

run_commands:
  - "python src/main.py --help"
  # Clause-by-clause diff of a customer's redline against Acme's original
  - "python src/main.py diff data/contracts/base/nda.docx data/contracts/redlines/nda_globex_v2.docx"
  - "python src/main.py diff data/contracts/base/msa.docx data/contracts/redlines/msa_globex_v2.docx"
  # Hybrid (keyword + embedding) search over the GDPR
  - "python src/main.py search \"sub-processor\""
  - "python src/main.py search \"transfer personal data outside the EU\" --chapter V"
  # Full AI review of each customer redline (uses claude -p with CLAUDE_KEY)
  - "python src/main.py review data/contracts/base/nda.docx data/contracts/redlines/nda_globex_v2.docx"
  - "python src/main.py review data/contracts/base/msa.docx data/contracts/redlines/msa_globex_v2.docx"
  - "python src/main.py review data/contracts/base/dpa.docx data/contracts/redlines/dpa_globex_v2.docx"
  - "python src/main.py review data/contracts/base/sow.docx data/contracts/redlines/sow_globex_v2.docx --related msa=data/contracts/base/msa.docx"
  # Eval: 45 labelled changes in 8 contracts, our pipeline vs one raw claude -p call (about 3 minutes)
  - "python src/main.py eval --baseline"

test_commands:
  - "python -m pytest -q"

notes: "Needs Python 3.10+ and the claude CLI (Claude Code) with CLAUDE_KEY set for the review commands; they stop with a clear error otherwise. Each review takes about 20-30 seconds; the eval about 3 minutes. Everything else runs on CPU and nothing is downloaded beyond pip packages."
